# Team configuration: where your Jenkins and GitLab live, and how your team labels work items.
# Copy this file to team.conf and fill it in. team.conf is not committed; share it with your team directly.
# A value goes right after the "=", comments need a line of their own.

# The Jenkins multibranch job that builds the GitLab project, as shown in the browser (MR builds are <url>/job/MR-<iid>).
jenkins_job_url=
# The GitLab instance, e.g. https://gitlab.example.com
gitlab_url=
# The project's full path in GitLab, e.g. group/subgroup/project
gitlab_project=

# Optional work item conventions, empty = off.
# Work items with this label get their own "Committed" section that sorting and limits never hide.
committed_label=
# Prefix of a scoped label whose value is shown before a work item's title, e.g. a due slot "slot::"
slot_label_prefix=
# Merge requests whose title starts with this don't count as work on a work item, e.g. automatic cascade MRs
ignored_merge_request_prefix=
