# Team configuration: where your Jenkins and GitLab live, and how your team labels work items.
# A value goes right after the "=", comments need a line of their own.

jenkins_job_url=https://jenkins.example.com/job/Example%20Team/job/group%252Fproject/
gitlab_url=https://gitlab.example.com/
gitlab_project=group/subgroup/project
committed_label=level::Committed
slot_label_prefix=slot::
ignored_merge_request_prefix=[cascade]
